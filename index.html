<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>할 일 관리</h1>
  </header>

  <main class="app-main">
    <section id="calendar-area">
      <div class="calendar-header">
        <button id="prev-month-btn" class="month-nav-btn" type="button" aria-label="이전 달">&lt;</button>
        <h2 id="current-year-month"></h2>
        <button id="next-month-btn" class="month-nav-btn" type="button" aria-label="다음 달">&gt;</button>
      </div>
      <div class="calendar-weekdays" id="calendar-weekdays"></div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <section id="detail-area">
      <div id="detail-content"></div>
    </section>
  </main>

  <div id="category-modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
      <div class="modal-header">
        <h2 id="category-modal-title">카테고리 설정</h2>
        <button id="category-modal-close-btn" class="modal-close-btn" type="button" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div id="category-list"></div>
        <div id="category-add-form"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
